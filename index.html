<style>
:root{--bg:#F3F1EC;--sf:#FBFAF7;--ink:#1A1916;--ink2:#58554D;--ink3:#69665D;--rule:#DAD6CC;--rule2:#B3AEA2;--inv:#1A1916;--onv:#F3F1EC;--scrim:rgba(26,25,22,.5);--lc:.46;--cc:.12;--col:560px;color-scheme:light}

:root[data-theme="dark"]{--bg:#131210;--sf:#1D1C19;--ink:#EEEBE4;--ink2:#BAB6AC;--ink3:#A09C91;--rule:#2E2C27;--rule2:#4A473F;--inv:#EEEBE4;--onv:#131210;--scrim:rgba(0,0,0,.66);--lc:.78;--cc:.10;color-scheme:dark}
*{box-sizing:border-box}

html{background:var(--bg)}

.now .lab::after{content:'';flex:1;height:2px;background:var(--ink)}

.sk .a{width:72%}.sk .b{width:42%}

.back{gap:2px;padding:0 10px 0 4px;font-size:15px;font-weight:500}

<script>
(function(){
'use strict';
var DEFAULT_SPACES=[{id:'trainer',name:'trAIner',h:250},{id:'time2ai',name:'Time2AI',h:38},{id:'essec',name:'ESSEC',h:155},{id:'stages',name:'Stages & alternance',h:350},{id:'vigie',name:'Vigie',h:80},{id:'admin',name:'Admin',h:205},{id:'perso',name:'Perso',h:125},{id:'clara',name:'Clara',h:300}];
/* teintes oklch du design pour les espaces connus ; les autres gardent leur teinte */
var HUE={trainer:250,time2ai:38,essec:155,stages:350,vigie:80,admin:205,perso:125,clara:300};
var CFG_KEY='cockpit.cfg',CACHE_KEY='cockpit.cache',THEME_KEY='cockpit.theme',DEFAULT_REPO='Adam2328/cockpit';
var tasks=new Map(),spaces=DEFAULT_SPACES.slice();
var view='today',upTab='7',spId=null,spTab='todo',catchOpen=true,loaded=false,offline=false,layer=null;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* icônes */
var I={
 today:'<path d="M5 4v16"/><circle cx="5" cy="8" r="2"/><circle cx="5" cy="16" r="2"/><path d="M11 8h9M11 16h9"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
 doneI:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',back:'<path d="M15 6l-6 6 6 6"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',
 bell:'<path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',rep:'<path d="M17 3l3 3-3 3M20 6H8a4 4 0 00-4 4M7 21l-3-3 3-3M4 18h12a4 4 0 004-4"/>',
 wait:'<path d="M7 3h10M7 21h10M8 3v3l4 6-4 6v3M16 3v3l-4 6 4 6v3"/>',note:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
 dawn:'<path d="M3 18h18M7 18a5 5 0 0110 0M12 6v3M5 10l2 2M19 10l-2 2"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',edit:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',
 undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',off:'<path d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 12.5a10 10 0 015-2.7M19 12.5a10 10 0 00-3-2.2M12 20h.01"/>'
};
var ic=function(n,c){return '<svg class="i '+(c||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+I[n]+'</svg>'};
/* dates */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayStr=function(){return iso(new Date())};
var parseISO=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var dayDiff=function(a,b){return Math.round((parseISO(a)-parseISO(b))/864e5)};
var addDays=function(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
var addMonth=function(s){var d=parseISO(s);d.setMonth(d.getMonth()+1);return iso(d)};
var nowHM=function(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
var fr=function(s,o){return parseISO(s).toLocaleDateString('fr-FR',o)};
var shortDate=function(s){return fr(s,{day:'numeric',month:'short'}).replace('.','')};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
function score(t){
  var s={1:30,2:16,3:6}[t.pr]||16;
  if(t.due){var d=dayDiff(t.due,todayStr());s+=d<0?60+Math.min(-d,10)*2:Math.max(0,40-d*4)}
  return s;
}
var DOWL=['L','M','M','J','V','S','D'],DOWF=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'],DOWS=['lun','mar','mer','jeu','ven','sam','dim'];
var isoDow=function(s){return parseISO(s).getDay()||7};
function nextDays(days,from){for(var i=1;i<=7;i++){var d=addDays(from,i);if(days.indexOf(isoDow(d))>=0)return d}return from}
function occDue(t){ /* prochaine occurrence d'une tâche à jours choisis (aujourd'hui si elle n'est pas déjà faite) */
  var T=todayStr();
  if(t.days.indexOf(isoDow(T))>=0&&!(t.lastDone&&iso(new Date(t.lastDone))===T))return T;
  return nextDays(t.days,T);
}
var dowTxt=function(days){return days.slice().sort().map(function(n){return DOWS[n-1]}).join(' · ')};
var dowBtns=function(sel,attr){return DOWL.map(function(l,i){return '<button class="btn dw" type="button" data-'+attr+'="'+(i+1)+'" aria-label="'+DOWF[i]+'" aria-pressed="'+(sel.indexOf(i+1)>=0)+'">'+l+'</button>'}).join('')};
function rollDays(){
  tasks.forEach(function(t,id){
    if(t.recur!=='days'||!t.days||!t.days.length||t.status!=='todo')return;
    var due=occDue(t);
    if(t.until&&due>t.until){tasks.set(id,Object.assign({},t,{status:'done',doneAt:new Date(t.until+'T23:00:00').getTime()}));return}
    var rem=shiftRemind(t,due);
    if(due!==t.due||rem!==(t.remind||''))tasks.set(id,Object.assign({},t,{due:due,remind:rem}));
  });
}
var timeOf=function(t){return t.remind?t.remind.slice(11):''};
var spaceOf=function(id){return spaces.find(function(s){return s.id===id})||{id:id,name:id||'Sans espace',h:210}};
var hueOf=function(s){return HUE[s.id]!=null?HUE[s.id]:s.h};
var norm=function(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'')};
var shiftRemind=function(t,due){return t.remind&&due?due+'T'+t.remind.slice(11):(t.remind||'')};
function dueDelta(t){return dayDiff(t.due,todayStr())}
var byTodo=function(){return Array.from(tasks.values()).filter(function(t){return t.status==='todo'})};
var byWait=function(){return Array.from(tasks.values()).filter(function(t){return t.status==='waiting'})};
function sortRows(a,b){
  var ta=timeOf(a),tb=timeOf(b);
  if(ta||tb)return (ta||'99').localeCompare(tb||'99');
  return score(b)-score(a)||(a.created||0)-(b.created||0);
}
/* ---------- données : tasks.json dans le dépôt GitHub (API contents) ---------- */
var cfg=lsGet(CFG_KEY),sha=null,saving=false,dirty=false,pushTimer=null,lastSync=0;
function api(method,body){
  return fetch((cfg.api||'https://api.github.com')+'/repos/'+cfg.repo+'/contents/tasks.json',{method:method,cache:'no-store',
    headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
}
var b64dec=function(s){var b=atob(s.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(b,function(c){return c.charCodeAt(0)}))};
var b64enc=function(s){var r='';new TextEncoder().encode(s).forEach(function(c){r+=String.fromCharCode(c)});return btoa(r)};
function snapshot(){return {exported_at:todayStr(),timezone:'Europe/Paris',spaces:spaces,tasks:Array.from(tasks.values())}}
function serialize(d){
  return '{\n  "exported_at": "'+d.exported_at+'",\n  "timezone": "'+d.timezone+'",\n  "spaces": [\n'+
    d.spaces.map(function(s){return '    '+JSON.stringify(s)}).join(',\n')+'\n  ],\n  "tasks": [\n'+
    d.tasks.map(function(t){return '    '+JSON.stringify(t)}).join(',\n')+'\n  ]\n}\n';
}
function apply(d){
  if(Array.isArray(d.spaces)&&d.spaces.length)spaces=d.spaces;
  tasks=new Map();
  (d.tasks||[]).forEach(function(x){tasks.set(x.id,Object.assign({pr:2,status:'todo',space:'perso',due:'',recur:'none',remind:'',note:'',subs:[],tags:[],early:0,place:'',until:''},x))});
  rollDays();loaded=true;
}
async function pull(){
  if(lsGet(UNSYNCED)){await push();return} /* des changements locaux attendent : on les envoie d'abord */
  var r=await api('GET');
  if(!r.ok)throw new Error(r.status);
  var j=await r.json(),d=JSON.parse(b64dec(j.content));
  sha=j.sha;lsSet(CACHE_KEY,d);apply(d);offline=false;lastSync=Date.now();render();
}
/* une seule écriture à la fois ; les changements rapprochés sont regroupés (0,7 s) pour ne pas multiplier les commits.
   Chaque changement est aussi gardé sur l'appareil jusqu'à ce qu'il soit bien enregistré : sans réseau, on réessaie plus tard. */
var UNSYNCED='cockpit.unsynced';
function pushSoon(){lsSet(UNSYNCED,snapshot());clearTimeout(pushTimer);pushTimer=setTimeout(push,700)}
var isNet=function(e){return e&&(e.name==='TypeError'||/fetch|network/i.test(e.message||''))};
async function push(){
  clearTimeout(pushTimer);pushTimer=null;
  if(saving){dirty=true;return}
  saving=true;var tries=0;
  try{
    do{
      dirty=false;var d=snapshot();
      var r=await api('PUT',{message:'app: mise à jour',content:b64enc(serialize(d)),sha:sha});
      if((r.status===409||r.status===422)&&++tries<3){sha=(await (await api('GET')).json()).sha;dirty=true;continue}
      if(!r.ok)throw new Error(r.status);
      sha=(await r.json()).content.sha;lsSet(CACHE_KEY,d);lastSync=Date.now();
      if(!dirty){try{localStorage.removeItem(UNSYNCED)}catch(x){}}
      if(offline){offline=false;render()}
    }while(dirty);
  }catch(e){
    if(isNet(e)){if(!offline){offline=true;render()}}
    else toast('Enregistrement impossible ('+e.message+'). Recharge la page.')
  }
  finally{saving=false}
}
window.addEventListener('online',function(){if(lsGet(UNSYNCED)&&cfg&&cfg.token)push()});
setInterval(function(){if(lsGet(UNSYNCED)&&!saving&&!pushTimer&&cfg&&cfg.token)push()},20000);
function upd(id,data){var t=tasks.get(id);if(!t)return;tasks.set(id,Object.assign({},t,data));render();pushSoon()}
function addTask(data){var id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);tasks.set(id,Object.assign({id:id},data));render();pushSoon();return id}
function delTask(id){tasks.delete(id);render();pushSoon()}
/* ---------- toast & actions ---------- */
var toastTimer=null;
function toast(msg,undo){
  var box=$('#toastbox');
  box.innerHTML='<div class="toast" role="status">'+ic('check')+'<span>'+esc(msg)+'</span>'+(undo?'<button class="btn" id="tu">Annuler</button>':'')+'</div>';
  if(undo)$('#tu').onclick=function(){undo();box.innerHTML=''};
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){box.innerHTML=''},5500);
}
function endTask(t){ /* la dernière occurrence est faite : la répétition s'arrête */
  var was=t.status,old={status:was,doneAt:0,lastDone:t.lastDone||0};
  upd(t.id,{status:'done',doneAt:Date.now(),lastDone:Date.now()});
  toast('Terminé : dernière occurrence',function(){upd(t.id,old)});
}
function nextOcc(t){var T=todayStr();return nextDays(t.days,(t.due&&t.due>T)?t.due:T)}
function complete(t){
  if(t.recur==='days'&&t.days&&t.days.length){
    var nx=nextOcc(t),pv={due:t.due||'',remind:t.remind||'',lastDone:t.lastDone||0};
    if(t.until&&nx>t.until){endTask(t);return}
    upd(t.id,{due:nx,remind:shiftRemind(t,nx),lastDone:Date.now()});
    toast('Fait. Prochaine : '+fr(nx,{weekday:'long',day:'numeric'}),function(){upd(t.id,pv)});return;
  }
  if(t.recur&&t.recur!=='none'){
    var T=todayStr(),base=(t.due&&t.due>T)?t.due:T;
    var next=t.recur==='daily'?addDays(base,1):t.recur==='weekly'?addDays(base,7):addMonth(base);
    if(t.until&&next>t.until){endTask(t);return}
    var prev={due:t.due||'',remind:t.remind||''};
    upd(t.id,{due:next,remind:shiftRemind(t,next),lastDone:Date.now()});
    toast('Fait. Prochaine : '+shortDate(next),function(){upd(t.id,prev)});
  }else{
    var was=t.status;
    upd(t.id,{status:'done',doneAt:Date.now()});
    toast('Terminé : '+t.title,function(){upd(t.id,{status:was||'todo',doneAt:0})});
  }
}
function snooze(t){
  if(t.recur==='days'&&t.days&&t.days.length){
    var n1=nextOcc(t),o1={due:t.due||'',remind:t.remind||'',lastDone:t.lastDone||0};
    upd(t.id,{due:n1,remind:shiftRemind(t,n1),lastDone:Date.now()});
    toast('Reportée à '+fr(n1,{weekday:'long',day:'numeric'}),function(){upd(t.id,o1)});return;
  }
  var T=todayStr(),base=(t.due&&t.due>=T)?t.due:T,old={due:t.due||'',remind:t.remind||''},next=addDays(base,1);
  upd(t.id,{due:next,remind:shiftRemind(t,next)});
  toast('Reportée à demain',function(){upd(t.id,old)});
}
/* ---------- rendu des lignes ---------- */
function metaHtml(t,o){
  var sp=spaceOf(t.space),m='<span class="sp" style="--h:'+hueOf(sp)+'"><i class="sq"></i>'+esc(sp.name)+'</span>';
  if(t.recur==='days'&&t.days&&t.days.length)m+='<span class="it">'+ic('rep','s')+esc(dowTxt(t.days))+(t.until?' · jusqu\'au '+esc(shortDate(t.until)):'')+'</span>';
  else if(t.recur&&t.recur!=='none')m+='<span class="it">'+ic('rep','s')+{daily:'chaque jour',weekly:'chaque semaine',monthly:'chaque mois'}[t.recur]+(t.until?' · jusqu\'au '+esc(shortDate(t.until)):'')+'</span>';
  if(t.status==='waiting')m+='<span class="it">'+ic('wait','s')+(t.due?'relance le '+esc(shortDate(t.due)):'en attente')+'</span>';
  if(o&&o.ago)m+='<span>'+esc(o.ago)+'</span>';
  if(t.place)m+='<span class="it">'+ic('pin','s')+esc(t.place)+'</span>';
  if(t.subs&&t.subs.length)m+='<span class="it">'+ic('check','s')+t.subs.filter(function(x){return x.d}).length+'/'+t.subs.length+'</span>';
  if(t.tags&&t.tags.length)m+='<span class="tag">'+t.tags.map(function(x){return '@'+esc(x)}).join(' ')+'</span>';
  if(t.note)m+='<span class="it">'+ic('note','s')+'note</span>';
  return '<div class="meta m">'+m+'</div>';
}
function rowHtml(t,o){
  o=o||{};
  return '<div class="swp" data-id="'+t.id+'"><div class="ul ul-l" aria-hidden="true">'+ic('check')+'Terminer</div><div class="ul ul-r" aria-hidden="true">+1 jour'+ic('arrow')+'</div>'+
   '<div class="row fg p'+t.pr+'"><span class="hr m">'+esc(o.hour||'')+'</span>'+
   '<button class="btn node" data-act="done" data-id="'+t.id+'" aria-label="Terminer : '+esc(t.title)+'"><span class="dot"></span></button>'+
   '<div class="body" data-act="edit" data-id="'+t.id+'"><div class="ttl">'+esc(t.title)+'</div>'+metaHtml(t,o)+'</div>'+
   (t.pr!==2?'<span class="pr">'+PRL[t.pr]+'</span>':'')+'</div></div>';
}
var sec=function(label,n){return '<div class="sec m"><span>'+esc(label)+'</span><span>'+n+'</span></div>'};
var rows=function(list,o){return list.map(function(t){return rowHtml(t,o&&o(t))}).join('')};
var hourFor=function(t){return timeOf(t)||(t.due?shortDate(t.due):'')};
/* ---------- vues ---------- */
function vToday(){
  var T=todayStr(),todo=byTodo(),dt=Array.from(tasks.values()).filter(function(t){return t.status==='done'&&t.doneAt&&iso(new Date(t.doneAt))===T}).length;
  var late=todo.filter(function(t){return t.due&&t.due<T}).sort(function(a,b){return a.due.localeCompare(b.due)});
  var today=todo.filter(function(t){return t.due===T}).sort(sortRows);
  var tomorrow=todo.filter(function(t){return t.due===addDays(T,1)}).sort(sortRows);
  var byD=function(a,b){return a.due.localeCompare(b.due)||sortRows(a,b)};
  var week=todo.filter(function(t){return t.due&&dueDelta(t)>=2&&dueDelta(t)<=7}).sort(byD),later=todo.filter(function(t){return t.due&&dueDelta(t)>7}).sort(byD);
  var none=todo.filter(function(t){return !t.due}).sort(sortRows),waitL=byWait().sort(function(a,b){return (a.due||'9').localeCompare(b.due||'9')});
  var seg=Math.round(dt/Math.max(1,dt+today.length)*9),bars='';
  for(var i=0;i<9;i++)bars+='<i class="'+(i<seg?'on':'')+'"></i>';
  var cnt=!loaded?'Synchronisation…':todo.length+' rappel'+(todo.length>1?'s':'')+' · '+dt+' faite'+(dt>1?'s':'')+' aujourd\'hui';
  var h='<header class="hd"><div class="kick m">'+esc(fr(T,{weekday:'long',day:'numeric',month:'long'}))+'</div><h1 class="big">Rappels</h1><div class="cnt m">'+cnt+'</div><div class="bars" aria-hidden="true">'+bars+'</div>'+
   '<button class="btn gear srch" data-go="search" aria-label="Rechercher">'+ic('search')+'</button><button class="btn gear" data-go="settings" aria-label="Réglages">'+ic('gear')+'</button></header>';
  if(offline)h+='<div class="banner" role="status">'+ic('off')+'<div><strong>Hors ligne.</strong> '+(lsGet(UNSYNCED)?'Tes changements partiront dès que le réseau revient.':'Tu vois les données du dernier chargement.')+'</div></div>';
  if(!loaded)return h+'<div class="prog" role="progressbar" aria-label="Synchronisation"><i></i></div>'+['a b','b a','a a','b b','a b','b a'].map(function(s){s=s.split(' ');return '<div class="sk"><b class="h"></b><span class="c"></span><div class="t"><b class="'+s[0]+'"></b><b class="'+s[1]+'"></b></div></div>'}).join('');
  if(!todo.length&&!waitL.length){
    return h+'<div class="empty"><svg width="24" height="150" viewBox="0 0 24 150" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 0v120" stroke-width="1"/><circle cx="12" cy="16" r="7" fill="currentColor"/><circle cx="12" cy="46" r="7" fill="currentColor"/><circle cx="12" cy="76" r="7" fill="currentColor"/><circle cx="12" cy="136" r="7" stroke-dasharray="2.5 4"/></svg><h2>Tout est fait.</h2><p>'+dt+' tâche'+(dt>1?'s':'')+' terminée'+(dt>1?'s':'')+' aujourd\'hui.'+'</p></div>';
  }
  if(late.length)h+='<div class="rat"><button class="btn tg" data-act="catch" aria-expanded="'+catchOpen+'">'+ic('chev','s chev'+(catchOpen?' open':''))+'À rattraper <span class="n m">'+late.length+'</span></button><button class="btn rp" data-act="replan">Tout replanifier</button></div>';
  if(catchOpen)h+=rows(late,function(t){return {hour:shortDate(t.due),ago:'depuis '+(-dueDelta(t))+' j'}});
  var untimed=today.filter(function(t){return !timeOf(t)}),timed=today.filter(timeOf),n=nowHM();
  if(!today.length)h+=sec('Aujourd\'hui',0);
  if(today.length){
    h+=sec('À faire aujourd\'hui',today.length)+rows(untimed);

var icsDate=function(d,tm){return d.replace(/-/g,'')+(tm?'T'+tm.replace(':','')+'00':'')};
function rrule0(t){
  if(t.recur==='days'&&t.days&&t.days.length)return 'FREQ=WEEKLY;BYDAY='+t.days.slice().sort().map(function(n){return ['MO','TU','WE','TH','FR','SA','SU'][n-1]}).join(',');
  return {daily:'FREQ=DAILY',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY'}[t.recur]||'';
}
function rrule(t){var r=rrule0(t);if(r&&t.until){var u=t.until.replace(/-/g,'');r+=';UNTIL='+(t.remind?u+'T235959':u)}return r}
function evtTimes(t){
  var d=t.due||(t.remind&&t.remind.slice(0,10))||todayStr();
  if(!t.remind)return {s:icsDate(d),e:icsDate(addDays(d,1)),allDay:true};
  var tm=t.remind.slice(11,16),total=(+tm.slice(0,2))*60+(+tm.slice(3,5))+30,ed=total>=1440?addDays(d,1):d;
  return {s:icsDate(d,tm),e:icsDate(ed,pad(Math.floor(total/60)%24)+':'+pad(total%60)),allDay:false};
}
function gcal(){
  var t=curTask();if(!t)return;
  var ev=evtTimes(t),rr=rrule(t);
  window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+ev.s+'/'+ev.e+(t.note?'&details='+encodeURIComponent(t.note):'')+(t.place?'&location='+encodeURIComponent(t.place):'')+(rr?'&recur='+encodeURIComponent('RRULE:'+rr):''),'_blank','noopener');
}
function downloadIcs(){
  var q=function(x){return String(x||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')};
  var stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',n=0,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fil//FR','CALSCALE:GREGORIAN'];
  tasks.forEach(function(t){
    if(t.status==='done'||(!t.due&&!t.remind))return;
    var ev=evtTimes(t),rr=rrule(t);n++;
    L.push('BEGIN:VEVENT','UID:'+t.id+'@fil','DTSTAMP:'+stamp,(ev.allDay?'DTSTART;VALUE=DATE:':'DTSTART:')+ev.s,(ev.allDay?'DTEND;VALUE=DATE:':'DTEND:')+ev.e,'SUMMARY:'+q(t.title));
    if(t.note)L.push('DESCRIPTION:'+q(t.note));
    if(t.place)L.push('LOCATION:'+q(t.place));
    if(rr)L.push('RRULE:'+rr);
    if(!ev.allDay)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+q(t.title),'TRIGGER:PT0S','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='fil.ics';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  toast(n+' événement'+(n>1?'s':'')+' exporté'+(n>1?'s':''));
}

var drag=null,lpTimer=null,suppress=false;

  var fg=e.target.closest('.row.fg');if(!fg||e.target.closest('[data-act="done"]'))return;
  var id=fg.parentNode.dataset.id;drag={fg:fg,id:id,x:e.clientX,y:e.clientY,dx:0,moving:false};
  clearTimeout(lpTimer);lpTimer=setTimeout(function(){if(drag&&!drag.moving){suppress=true;var i=drag.id;drag=null;openActions(i)}},500);

document.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moving&&(Math.abs(dy)>10||Math.abs(dx)>10)){if(Math.abs(dx)>Math.abs(dy)){drag.moving=true;drag.fg.parentNode.classList.add('on');try{drag.fg.setPointerCapture(e.pointerId)}catch(x){}}clearTimeout(lpTimer);if(!drag.moving){drag=null;return}}
  if(drag.moving){drag.dx=Math.max(-150,Math.min(150,dx));drag.fg.style.transform='translateX('+drag.dx+'px)'}

  if(!drag){clearTimeout(lpTimer);return}
  var d=drag;clearTimeout(lpTimer);drag=null;
  if(d.moving){suppress=true;d.fg.parentNode.classList.remove('on');var t=tasks.get(d.id);d.fg.style.transform='';if(t){if(d.dx>90)complete(t);else if(d.dx<-90)snooze(t)}}

  if(b.dataset.view){view=b.dataset.view;closeLayer();render();window.scrollTo(0,0);return}
  if(b.dataset.mg){mgSpace=b.dataset.mg;mgSel=new Set();view='mspace';render();window.scrollTo(0,0);return}
  if(b.dataset.go){view=b.dataset.go;render();window.scrollTo(0,0);if(view==='search'){var si=$('#s-q');if(si)si.focus()}return}
  if(b.dataset.sq){var sv=b.dataset.sq,si2=sv.indexOf(':'),sk=sv.slice(0,si2),vv=sv.slice(si2+1);sq[sk]=sk==='pr'?+vv:(sk==='tag'&&sq.tag===vv?'':vv);render();return}
  if(b.dataset.up){upTab=b.dataset.up;render();return}
  if(b.dataset.sp){spId=b.dataset.sp;render();return}
  if(b.dataset.st){spTab=b.dataset.st;render();return}
  if(b.dataset.theme){lsSet(THEME_KEY,b.dataset.theme);applyTheme();render();return}
  if(b.dataset.due!==undefined&&layer&&layer.type==='edit'){$('#f-due').value=b.dataset.due;commitEdit();return}
  if(b.dataset.rem){
    var r=remindAt(b.dataset.rem);
    if(layer&&layer.type==='actions'){var tt=tasks.get(layer.id);closeLayer();if(tt){var old={due:tt.due,remind:tt.remind};upd(tt.id,{due:r.due,remind:r.due+'T'+r.time});toast('Rappel à '+r.time,function(){upd(tt.id,old)})}}
    else if(layer&&layer.type==='edit'){$('#f-due').value=r.due;$('#f-time').value=r.time;$('#f-sw').setAttribute('aria-checked','true');commitEdit()}
    return;
  }
  if(b.dataset.until!==undefined&&layer&&layer.type==='edit'){$('#f-until').value=b.dataset.until;commitEdit();return}
  if(b.dataset.dow&&layer&&layer.type==='edit'){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));commitEdit();return}
  if(b.parentNode&&b.parentNode.dataset&&b.parentNode.dataset.k&&layer&&layer.type==='edit'){
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});commitEdit();return;
  }
  if(b.id==='f-sw'){b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));commitEdit();return}
  switch(a){
    case 'done':if(t)complete(t);break;
    case 'edit':if(t)openEdit(id);break;
    case 'reopen':if(t)upd(id,{status:'todo',doneAt:0});break;
    case 'catch':catchOpen=!catchOpen;render();break;
    case 'replan':var T=todayStr(),late=byTodo().filter(function(x){return x.due&&x.due<T}),olds=late.map(function(x){return {id:x.id,due:x.due,remind:x.remind}});
      late.forEach(function(x){upd(x.id,{due:T,remind:shiftRemind(x,T)})});toast(late.length+' replanifiée'+(late.length>1?'s':'')+' à aujourd\'hui',function(){olds.forEach(function(o){upd(o.id,{due:o.due,remind:o.remind})})});break;
    case 'add':openNew();break;
    case 'fiche-add':ficheAdd();break;
    case 'close':closeLayer();break;
    case 'a-done':if(layer){var x=tasks.get(layer.id);closeLayer();if(x)complete(x)}break;
    case 'a-snooze':if(layer){var y=tasks.get(layer.id);closeLayer();if(y)snooze(y)}break;
    case 'a-edit':if(layer){var z=layer.id;closeLayer();openEdit(z)}break;
    case 'a-wait':if(layer){var w=tasks.get(layer.id);closeLayer();if(w)upd(w.id,{status:w.status==='waiting'?'todo':'waiting'})}break;
    case 'a-del':case 'e-del':
      if(!b.classList.contains('arm')){var lab=b.innerHTML;b.classList.add('arm');b.innerHTML=ic('trash')+'Confirmer';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.innerHTML=lab}},4000);break}
      var did=layer&&layer.id;closeLayer();if(did){var dt=tasks.get(did);delTask(did);toast('Supprimée',function(){tasks.set(dt.id,dt);render();pushSoon()})}break;
    case 'e-done':if(layer){var q=tasks.get(layer.id);closeLayer();if(q)complete(q)}break;
    case 'showtok':var inp=$('#s-tok');inp.type=inp.type==='password'?'text':'password';b.textContent=inp.type==='password'?'Afficher':'Masquer';break;
    case 'test':testConn();break;
    case 'sub-add':subAdd();break;
    case 'sub-tog':case 'sub-del':if(layer&&layer.type==='edit')subOp(a,+b.dataset.i);break;
    case 'gcal':gcal();break;
    case 'maps':{var pl=($('#f-place').value||'').trim();if(pl)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(pl),'_blank','noopener');break}
    case 'ics':downloadIcs();break;
    case 'pk-close':closePicker();break;
    case 'sq-space':pickSpace('Espace',sq.space,null,function(v){sq.space=v;render()},'Tous les espaces');break;
    case 'pick-space':{var tg=b.dataset.t;
      pickSpace('Espace',$('#'+tg+'-space').value,null,function(v){
        if(tg==='f'&&layer&&layer.type==='edit'){$('#f-space').value=v;$('#f-spn').textContent=spaceOf(v).name;$('#f-spc').style.setProperty('--h',hueOf(spaceOf(v)));commitEdit()}
      });break}
    case 'a-move':if(layer){var mv=layer.id,mt=tasks.get(mv);closeLayer();if(mt)pickSpace('Déplacer vers…',mt.space,null,function(to){upd(mv,{space:to});toast('Déplacée vers '+spaceOf(to).name)})}break;
    case 'space-open':openSpaceSheet(b.dataset.sid);break;
    case 'msel':if(id){if(mgSel.has(id))mgSel.delete(id);else mgSel.add(id);render()}break;
    case 'msel-all':{var allIds=mgTasks().map(function(x){return x.id});mgSel=mgSel.size===allIds.length?new Set():new Set(allIds);render();break}
    case 'mmove':if(mgSel.size){var cnt=mgSel.size;pickSpace('Déplacer '+cnt+' tâche'+(cnt>1?'s':'')+' vers…',null,mgSpace,function(to){
      var ids=Array.from(mgSel),prev=ids.map(function(i){return tasks.get(i)}).filter(Boolean);
      prev.forEach(function(t){tasks.set(t.id,Object.assign({},t,{space:to}))});mgSel=new Set();render();pushSoon();
      toast(prev.length+' déplacée'+(prev.length>1?'s':'')+' vers '+spaceOf(to).name,function(){prev.forEach(function(t){tasks.set(t.id,t)});render();pushSoon()});
    })}break;
    case 'mdel':if(!mgSel.size)break;
      if(!b.classList.contains('arm')){var lab2=b.innerHTML;b.classList.add('arm');b.innerHTML=ic('trash')+'Confirmer';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.innerHTML=lab2}},4000);break}
      var removed=Array.from(mgSel).map(function(i){return tasks.get(i)}).filter(Boolean);
      removed.forEach(function(t){tasks.delete(t.id)});mgSel=new Set();render();pushSoon();
      toast(removed.length+' supprimée'+(removed.length>1?'s':''),function(){removed.forEach(function(t){tasks.set(t.id,t)});render();pushSoon()});break;
    case 'sp-rename':{var nm=$('#sp-name').value.trim(),sid=layer&&layer.id;if(nm&&sid){spaces=spaces.map(function(x){return x.id===sid?Object.assign({},x,{name:nm}):x});closeLayer();render();pushSoon();toast('Renommé')}break}
    case 'sp-move':if(layer){var from=layer.id;pickSpace('Déplacer les tâches vers…',null,from,function(to){var u=moveTasks(from,to);closeLayer();toast('Tâches déplacées vers '+spaceOf(to).name,u)})}break;
    case 'sp-del':if(layer){var did2=layer.id,nn=layer.n;
      if(nn>0)pickSpace(nn>1?'Où mettre les '+nn+' tâches ?':'Où mettre la tâche ?',null,did2,function(to){closeLayer();deleteSpace(did2,to)});
      else if(!b.classList.contains('arm')){var lb=b.innerHTML;b.classList.add('arm');b.innerHTML=ic('trash')+'Confirmer';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.innerHTML=lb}},4000)}
      else{closeLayer();deleteSpace(did2,null)}}break;
  }
});
document.addEventListener('input',function(e){if(e.target.id==='s-q'){sq.text=e.target.value;$('#sres').innerHTML=searchResults()}else if(e.target.id==='f-title'&&layer&&layer.isNew)applyPhrase()});
document.addEventListener('change',function(e){if(layer&&layer.type==='edit'&&e.target.closest('#ef'))commitEdit()});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='sub-in'){e.preventDefault();subAdd();return}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='f-title'&&layer&&layer.isNew){e.preventDefault();ficheAdd();return}
  if(e.key!=='Escape')return;if(pickCb)closePicker();else if(layer)closeLayer();
});
document.addEventListener('submit',function(e){if(e.target.id==='newsp'){e.preventDefault();var i=$('#nsp');addSpace(i.value);i.value=''}});
async function testConn(){
  var repo=$('#s-repo').value.trim(),tok=$('#s-tok').value.trim();
  cfg={repo:repo,token:tok||cfg.token};lsSet(CFG_KEY,cfg);
  try{await pull();toast('Connexion OK')}catch(err){offline=true;toast('Échec ('+err.message+')');render()}
}
function applyTheme(){var th=lsGet(THEME_KEY)||'auto',r=document.documentElement;if(th==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',th)}
/* ---------- démarrage ---------- */
async function start(){
  applyTheme();
  if(!cfg||!cfg.token){showSetup();return}
  var pending=lsGet(UNSYNCED),cached=pending||lsGet(CACHE_KEY);if(cached)apply(cached);
  render();
  try{await pull();openHash()}
  catch(e){
    if(['401','403','404'].indexOf(e.message)>=0){showSetup('Connexion refusée ('+e.message+'). Vérifie le dépôt et le jeton.');return}
    offline=true;loaded=!!cached;render();
    if(!cached)$('#view').insertAdjacentHTML('beforeend','<div class="empty"><h2>Hors ligne</h2><p>Impossible de charger les tâches.</p></div>');
    else openHash();
  }
}
function openHash(){ /* « #t=ID » : la notification ouvre directement la tâche */
  var m=location.hash.match(/^#t=(.+)$/);
  if(m){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(tasks.has(m[1])&&!layer)openEdit(m[1])}
}
window.addEventListener('hashchange',openHash);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(dirty||pushTimer)push();return}
  if(cfg&&cfg.token&&!saving&&!pushTimer&&!layer)pull().catch(function(){offline=true;render()});
  openHash();
});
setInterval(function(){if(!document.hidden&&view==='today'&&!layer&&!drag)render()},60000); /* le repère « Maintenant » avance */
start();
if('serviceWorker' in navigator){
  var hadSw=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSw&&!reloaded&&!layer&&!saving&&!lsGet(UNSYNCED)){reloaded=true;location.reload()}}); /* nouvelle version : on recharge une fois */
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
